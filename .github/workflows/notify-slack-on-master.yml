name: Notify Slack on main updates

on:
  push:
    branches: [ main ]   # fires on any push/merge to main

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "`main` branch updated by `${{ github.actor }}`. <${{ github.event.compare }}|View diff>",
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
